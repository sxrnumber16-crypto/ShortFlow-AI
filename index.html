<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch ? _origFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>ShortFlow AI - স্বয়ংক্রিয় এআই শর্টস প্রকাশনা প্ল্যাটফর্ম</title>
    <meta name="description" content="Autonomous AI Shorts Publishing & Scheduling Platform for Facebook, Instagram, and YouTube." />
    <meta property="og:title" content="ShortFlow AI - স্বয়ংক্রিয় এআই শর্টস প্রকাশনা প্ল্যাটফর্ম" />
    <meta property="og:description" content="স্বয়ংক্রিয় এআই শর্টস প্রকাশনা ও শিডিউলিং প্ল্যাটফর্ম (Facebook, Instagram, YouTube)" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>

  </body>
</html>
